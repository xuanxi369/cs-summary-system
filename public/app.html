  <style>
    /* === Base === */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { background: #FAFBFE; font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif; }

    /* === Scrollbar === */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }

    /* === Focus ring === */
    :focus-visible {
      outline: 2px solid #6366F1;
      outline-offset: 2px;
      border-radius: 8px;
    }

    /* === Textarea === */
    .input-area {
      resize: vertical;
      min-height: 220px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-area:focus {
      border-color: #6366F1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
      outline: none;
    }

    /* === Score ring === */
    .score-ring-track { fill: none; stroke: #E8ECF4; }
    .score-ring-fill {
      fill: none;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s cubic-bezier(0.16, 1, 0.3, 1);
      transform: rotate(-90deg);
      transform-origin: center;
    }

    /* === Progress bar === */
    .progress-bar {
      height: 6px;
      border-radius: 3px;
      background: #E8ECF4;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #6366F1, #818CF8);
      transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* === Status chips === */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8125rem;
      font-weight: 500;
      line-height: 1.3;
      white-space: nowrap;
    }
    .chip-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .chip-resolved { background: #ECFDF5; color: #059669; }
    .chip-resolved .chip-dot { background: #10B981; }
    .chip-processing { background: #FFF1F2; color: #E11D48; }
    .chip-processing .chip-dot { background: #F43F5E; }
    .chip-pending { background: #FFFBEB; color: #D97706; }
    .chip-pending .chip-dot { background: #F59E0B; }

    /* === Card expand === */
    .result-card { transition: box-shadow 0.25s, transform 0.25s; }
    .result-card:hover { box-shadow: 0 8px 25px rgba(15,18,25,0.08), 0 2px 6px rgba(15,18,25,0.04); }
    .detail-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
      opacity: 0;
    }
    .detail-panel.open {
      max-height: 800px;
      opacity: 1;
    }

    /* === Toast Animations === */
    @keyframes toastInAnim {
      0% { opacity: 0; transform: translateY(12px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      padding: 14px 20px;
      border-radius: 12px;
      background: #0F1219;
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 500;
      box-shadow: 0 12px 40px rgba(15,18,25,0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastInAnim 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .toast-success .toast-icon { color: #34D399; }
    .toast-error .toast-icon { color: #FB7185; }
    .toast-info .toast-icon { color: #818CF8; }

    /* === Button base === */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-primary {
      background: #6366F1;
      color: #fff;
      box-shadow: 0 2px 8px rgba(99,102,241,0.3);

    .btn-primary:hover:not(:disabled) {

      padding: 10px 16px;

    /* === Tricolor accent line === */
    .accent-line {
      height: 3px;
      background: linear-gradient(90deg, #6366F1 0%, #F43F5E 50%, #10B981 100%);

    @keyframes fadeUpAnim {
      0% { opacity: 0; transform: translateY(16px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .stagger-children > * {
      opacity: 0;
      animation: fadeUpAnim 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .stagger-children > *:nth-child(1) { animation-delay: 0.05s; }
    .stagger-children > *:nth-child(2) { animation-delay: 0.1s; }
    .stagger-children > *:nth-child(3) { animation-delay: 0.15s; }

    .stagger-children > *:nth-child(6) { animation-delay: 0.3s; }
    .stagger-children > *:nth-child(7) { animation-delay: 0.35s; }
    .stagger-children > *:nth-child(8) { animation-delay: 0.4s; }
    .stagger-children > *:nth-child(9) { animation-delay: 0.45s; }
    .stagger-children > *:nth-child(10) { animation-delay: 0.5s; }

<script>

// ---------- State ----------
let parsedDialogues = [];
let results = [];
let isProcessing = false;

// ---------- DOM refs ----------
const $inputJson = document.getElementById('input-json');
const $inputApiKey = document.getElementById('input-apikey');
const $inputWorkerUrl = document.getElementById('input-worker-url');
const $btnAnalyze = document.getElementById('btn-analyze');
const $inputCount = document.getElementById('input-count');
const $sectionInput = document.getElementById('section-input');
const $sectionProgress = document.getElementById('section-progress');
const $sectionDashboard = document.getElementById('section-dashboard');
const $progressText = document.getElementById('progress-text');
const $progressCount = document.getElementById('progress-count');
const $progressFill = document.getElementById('progress-fill');
const $progressDetail = document.getElementById('progress-detail');
const $statsGrid = document.getElementById('stats-grid');
const $resultsList = document.getElementById('results-list');

// ---------- Init ----------
$inputJson.addEventListener('input', debounce(validateInput, 300));
$inputJson.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    if (!$btnAnalyze.disabled) startAnalysis();
  }
});

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function debounce(fn, ms) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
}

function validateInput() {
  const raw = $inputJson.value.trim();
  if (!raw) {
    parsedDialogues = [];
    $inputCount.textContent = '未检测到有效对话';
    $btnAnalyze.disabled = true;
    return;
  }
  try {
    const data = JSON.parse(raw);
    const arr = Array.isArray(data) ? data : [data];
    const valid = arr.filter(d => d && Array.isArray(d.turns) && d.turns.length > 0);
    parsedDialogues = valid;
    $inputCount.textContent = `检测到 ${valid.length} 段对话`;
    $inputCount.className = valid.length > 0 ? 'text-caption text-emerald-500' : 'text-caption text-rose-500';
    $btnAnalyze.disabled = valid.length === 0;
  } catch {
    parsedDialogues = [];
    $inputCount.textContent = 'JSON 格式错误，请检查';
    $inputCount.className = 'text-caption text-rose-500';
    $btnAnalyze.disabled = true;
  }
}

// ---------- Analysis ----------
async function startAnalysis() {
  if (isProcessing || parsedDialogues.length === 0) return;
  isProcessing = true;
  results = [];

  // UI → progress
  $sectionProgress.classList.remove('hidden');
  $sectionDashboard.classList.add('hidden');
  $progressFill.style.width = '0%';
  $btnAnalyze.disabled = true;

  const total = parsedDialogues.length;
  let completed = 0;
  let failed = 0;

  updateProgress(0, total, '正在准备分析...');

  // 并发控制：最多 3 个并发
  const concurrency = 7;
  const queue = [...parsedDialogues];
  const workers = [];

  for (let i = 0; i < concurrency; i++) {
    workers.push(runWorker());
  }

  async function runWorker() {
    while (queue.length > 0) {
      const dialogue = queue.shift();
      if (!dialogue) break;

      updateProgress(completed, total, `正在分析对话 #${dialogue.id || completed + 1}...`);

      try {
        const result = await analyzeDialogue(dialogue);
        results.push(result);
        completed++;
      } catch (err) {
        results.push({
          id: dialogue.id || '?',
          summary: `分析失败: ${err.message}`,
          score: 0,
          score_label: '失败',
          reasoning: err.message,
          status: '待解决',
          user_intent: '-',
          agent_action: '-',
          error: true,
        });
        completed++;
        failed++;
      }

      updateProgress(completed, total, `已完成 ${completed}/${total}${failed > 0 ? `（${failed} 失败）` : ''}`);
    }
  }

  // 等待所有 worker 完成
  await Promise.all(workers);

  isProcessing = false;
  updateProgress(total, total, '分析完成');
  $progressText.textContent = '分析完成 ✓';
  $progressDetail.textContent = failed > 0
    ? `成功 ${total - failed} 段，失败 ${failed} 段`
    : `全部 ${total} 段对话分析完成`;

  showToast(
    failed > 0
      ? `分析完成：成功 ${total - failed} 段，失败 ${failed} 段`
      : `全部 ${total} 段对话分析完成 ✓`,
    failed > 0 ? 'error' : 'success'
  );

  setTimeout(() => renderDashboard(), 600);
}

async function analyzeDialogue(dialogue) {
  const workerUrl = $inputWorkerUrl.value.trim();
  const apiKey = $inputApiKey.value.trim();

  if (!workerUrl) throw new Error('请填写 Worker 地址');

  const resp = await fetch(`${workerUrl}/api/summarize`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dialogue, api_key: apiKey || undefined }),
  });

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
    throw new Error(err.error || `请求失败 (${resp.status})`);
  }

  return await resp.json();
}

function updateProgress(done, total, detail) {
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  $progressFill.style.width = `${pct}%`;
  $progressCount.textContent = `${done} / ${total}`;
  if (detail) $progressDetail.textContent = detail;
}

// ---------- Render Dashboard ----------
function renderDashboard() {
  $sectionProgress.classList.add('hidden');
  $sectionDashboard.classList.remove('hidden');

  // Stats
  const total = results.length;
  const resolved = results.filter(r => r.status === '已解决').length;
  const processing = results.filter(r => r.status === '处理中').length;
  const avgScore = total > 0
    ? (results.filter(r => !r.error).reduce((s, r) => s + r.score, 0) / results.filter(r => !r.error).length).toFixed(1)
    : '—';

  $statsGrid.innerHTML = [
    statCard('总对话', total, '对话总数', '#6366F1', 'bg-blue-50'),
    statCard('已解决', resolved, `占比 ${total > 0 ? Math.round(resolved/total*100) : 0}%`, '#10B981', 'bg-emerald-50'),
    statCard('处理中', processing, `占比 ${total > 0 ? Math.round(processing/total*100) : 0}%`, '#F43F5E', 'bg-rose-50'),
    statCard('平均评分', avgScore, '满分 5.0', '#F59E0B', 'bg-amber-50'),
  ].join('');

  // Results
  $resultsList.innerHTML = results.map((r, i) => resultCard(r, i)).join('');

  // Animate score rings
  requestAnimationFrame(() => {
    document.querySelectorAll('.score-ring-fill').forEach(el => {
      const target = el.getAttribute('data-target');
      el.style.strokeDashoffset = target;
    });
  });
}

function statCard(label, value, sub, color, bgColor) {
  return `
    <div class="bg-white rounded-2xl border border-surface-200 shadow-card px-5 py-5">
      <div class="flex items-center gap-2 mb-2">
        <div class="w-2 h-2 rounded-full" style="background:${color}"></div>
        <span class="text-label text-ink-500">${label}</span>
      </div>
      <div class="text-display" style="color:${color}">${value}</div>
      <div class="text-caption text-ink-400 mt-1">${sub}</div>
    </div>`;
}

function resultCard(r, index) {
  const statusClass = r.status === '已解决' ? 'resolved' : r.status === '处理中' ? 'processing' : 'pending';
  const scoreColor = r.error ? '#9CA3AF' : r.score >= 4 ? '#10B981' : r.score >= 3 ? '#F59E0B' : '#F43F5E';
  const circumference = 2 * Math.PI * 28; // r=28
  const offset = r.error ? circumference : circumference * (1 - r.score / 5);
  const dialogue = parsedDialogues.find(d => d.id === r.id) || {};

  return `
    <div class="result-card bg-white rounded-2xl border border-surface-200 shadow-card overflow-hidden">
      <div class="px-6 py-5 cursor-pointer flex items-start gap-5" onclick="toggleDetail(${index})">
        <div class="flex-shrink-0 hidden sm:block">
          <svg width="64" height="64" viewBox="0 64 64">
            <circle class="score-ring-track" cx="32" cy="32" r="28" stroke-width="4"/>
            <circle class="score-ring-fill" cx="32" cy="32" r="28" stroke-width="4"
              stroke="${scoreColor}"
              stroke-dasharray="${circumference}"
              stroke-dashoffset="${circumference}"
              data-target="${offset}"/>
            <text x="32" y="37" text-anchor="middle" font-size="18" font-weight="700"
              fill="${r.error ? '#9CA3AF' : '#0F1219'}" font-family="Inter, sans-serif">
              ${r.error ? '—' : r.score}
            </text>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-3 mb-2 flex-wrap">
            <span class="font-mono text-label text-ink-400">#${r.id}</span>
            <span class="chip chip-${statusClass}">
              <span class="chip-dot"></span>
              ${r.status}
            </span>
            <span class="sm:hidden text-subhead" style="color:${scoreColor}">
              ${r.error ? '—' : r.score + '分'}
            </span>
          </div>
          <p class="text-body text-ink-700 leading-relaxed">${escapeHtml(r.summary)}</p>
          <div class="flex items-center gap-4 mt-3 flex-wrap">
            <span class="text-caption text-ink-400">
              <span class="font-medium text-ink-500">诉求</span> ${escapeHtml(r.user_intent) || '-'}
            </span>
            <span class="text-caption text-ink-400">
              <span class="font-medium text-ink-500">措施</span> ${escapeHtml(r.agent_action) || '-'}
            </span>
          </div>
        </div>
        <div class="flex-shrink-0 mt-2 transition-transform duration-300" id="arrow-${index}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
      </div>
      <div class="detail-panel" id="detail-${index}">
        <div class="px-6 pb-6 pt-2 border-t border-surface-100">
          <div class="mb-5">
            <h4 class="text-label text-ink-500 mb-3">AI 质量评估</h4>
            <div class="bg-surface-50 rounded-xl p-4">
              <div class="flex items-center gap-3 mb-2">
                <span class="text-subhead" style="color:${scoreColor}">${escapeHtml(r.score_label)}</span>
                <span class="text-caption text-ink-400">·</span>
                <span class="text-label" style="color:${scoreColor}">${r.score}/5 分</span>
              </div>
              <p class="text-body text-ink-700">${escapeHtml(r.reasoning)}</p>
            </div>
          </div>
          ${dialogue.turns ? `
          <div>
            <h4 class="text-label text-ink-500 mb-3">对话原文</h4>
            <div class="space-y-2 max-h-64 overflow-y-auto pr-2">
              ${dialogue.turns.map(t => `
                <div class="${t.role === 'user' ? 'turn-user' : 'turn-agent'} rounded-xl px-4 py-3">
                  <span class="text-caption font-medium ${t.role === 'user' ? 'text-blue-500' : 'text-emerald-500'}">
                    ${t.role === 'user' ? '用户' : '客服'}
                  </span>
                  <p class="text-body text-ink-700 mt-1">${escapeHtml(t.content)}</p>
                </div>
              `).join('')}
            </div>
          </div>
          ` : ''}
          ${dialogue.reference_summary ? `
          <div class="mt-4 p-3 bg-surface-50 rounded-xl">
            <span class="text-caption font-medium text-ink-400">参考摘要</span>
            <p class="text-body text-ink-500 mt-1">${escapeHtml(dialogue.reference_summary)}</p>
          </div>
          ` : ''}
        </div>
      </div>
    </div>`;
}

function toggleDetail(index) {
  const panel = document.getElementById(`detail-${index}`);
  const arrow = document.getElementById(`arrow-${index}`);
  const isOpen = panel.classList.contains('open');
  panel.classList.toggle('open');
  arrow.style.transform = isOpen ? '' : 'rotate(180deg)';
}

// ---------- Export CSV ----------
function exportCSV() {
  if (results.length === 0) return;
  const header = 'ID,摘要,状态,评分,评分标签,评分理由,用户诉求,客服措施';
  const rows = results.map(r =>
    [r.id, `"${(r.summary||'').replace(/"/g,'""')}"`, r.status, r.score, r.score_label,
     `"${(r.reasoning||'').replace(/"/g,'""')}"`, `"${(r.user_intent||'').replace(/"/g,'""')}"`,
     `"${(r.agent_action||'').replace(/"/g,'""')}"`].join(',')
  );
  const csv = '\uFEFF' + header + '\n' + rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cs-analysis-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV 报告已导出', 'success');
}

// ---------- Reset ----------
function resetAll() {
  results = [];
  // 保留输入数据，只重置结果
  $sectionDashboard.classList.add('hidden');
  $sectionProgress.classList.add('hidden');
  validateInput(); // 重新验证已有输入，恢复按钮状态
  $sectionInput.scrollIntoView({ behavior: 'smooth' });
  showToast('已重置结果，可重新分析', 'info');
}

// ---------- Toast ----------
function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const icons = {
    success: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    error: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
  };

  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.innerHTML = `<span class="toast-icon">${icons[type]}</span>${message}`;
  container.appendChild(el);

  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    el.style.transition = 'all 0.3s ease';
    setTimeout(() => el.remove(), 300);
  }, 3500);
}
